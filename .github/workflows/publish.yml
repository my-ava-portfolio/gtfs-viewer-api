name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version'
        required: true
        default: 'latest'
      architecture:
        description: 'Architecture cible'
        required: true
        type: choice
        default: 'both'
        options:
          - amd64
          - arm64
          - both

jobs:
  set-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event.inputs.architecture }}" = "both" ]; then
            echo 'matrix={"include":[{"platform":"linux/amd64","runner":"ubuntu-24.04","arch_tag":"amd64"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","arch_tag":"arm64"}]}' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.architecture }}" = "amd64" ]; then
            echo 'matrix={"include":[{"platform":"linux/amd64","runner":"ubuntu-24.04","arch_tag":"amd64"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","arch_tag":"arm64"}]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: set-matrix
    strategy:
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: amauryval
          password: ${{ secrets.CR_PAT }}

      - name: Build and push (per-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/my-ava-portfolio/${{ github.event.repository.name }}:${{ github.event.inputs.version }}-${{ matrix.arch_tag }}
          cache-from: type=gha,scope=${{ matrix.arch_tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch_tag }}

  merge:
    needs: build
    if: ${{ github.event.inputs.architecture == 'both' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: amauryval
          password: ${{ secrets.CR_PAT }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/my-ava-portfolio/${{ github.event.repository.name }}:${{ github.event.inputs.version }} \
            ghcr.io/my-ava-portfolio/${{ github.event.repository.name }}:${{ github.event.inputs.version }}-amd64 \
            ghcr.io/my-ava-portfolio/${{ github.event.repository.name }}:${{ github.event.inputs.version }}-arm64

  single-arch-tag:
    needs: build
    if: ${{ github.event.inputs.architecture != 'both' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: amauryval
          password: ${{ secrets.CR_PAT }}

      - name: Retag single-arch image without suffix
        run: |
          docker buildx imagetools create \
            -t ghcr.io/my-ava-portfolio/${{ github.event.repository.name }}:${{ github.event.inputs.version }} \
            ghcr.io/my-ava-portfolio/${{ github.event.repository.name }}:${{ github.event.inputs.version }}-${{ github.event.inputs.architecture }}